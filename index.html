<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kharcha Tracker</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--text:#1c1e2b;--muted:#6b7086;--border:#e1e3ee;--accent:#5b5bf0;--danger:#e5484d;--chip:#eceefa}
@media (prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1b1d28;--text:#eceef7;--muted:#9a9fb8;--border:#2c2f40;--accent:#8587ff;--danger:#ff6b70;--chip:#262939}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:16px}
h1{margin:8px 0 14px;font-size:1.6rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
input,select,button{font:inherit;color:var(--text)}
input,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 12px}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;width:100%;margin-top:8px;padding:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:2px}
.total{text-align:center}
.total b{display:block;font-size:2rem;color:var(--accent)}
.total span{color:var(--muted);font-size:.85rem}
.bar-row{margin:10px 0}
.bar-top{display:flex;justify-content:space-between;font-size:.85rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
li.item:last-child{border-bottom:0}
.info{flex:1;min-width:0}
.note{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:.8rem;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.del{color:var(--danger);padding:4px 9px}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.head h2{margin:0;font-size:1.05rem}
.head input{width:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Kharcha Tracker</h1>

  <form class="card" id="form" autocomplete="off">
    <div class="grid">
      <div><label for="amount">Amount (₹)</label><input id="amount" type="number" min="1" step="any" placeholder="200" required></div>
      <div><label for="cat">Category</label><select id="cat"></select></div>
    </div>
    <div class="grid">
      <div><label for="note">Kis liye?</label><input id="note" maxlength="80" placeholder="Jaise: chai, auto, kitab"></div>
      <div><label for="date">Date</label><input id="date" type="date" required></div>
    </div>
    <button class="primary" type="submit">Kharcha jodo</button>
  </form>

  <div class="card">
    <div class="head"><h2>Mahina</h2><input id="month" type="month"></div>
    <div class="total"><b id="total">₹0</b><span id="count">0 kharche</span></div>
  </div>

  <div class="card">
    <div class="head"><h2>Category-wise</h2></div>
    <div id="bars"></div>
  </div>

  <div class="card">
    <div class="head"><h2>Kharche ki list</h2><button id="clear" type="button" class="del">Sab hatao</button></div>
    <ul id="list"></ul>
  </div>
</div>

<script>
(function(){
"use strict";
var KEY="kharcha.v1";
var CATS=["Khana","Travel","Shopping","Bills","Padhai","Other"];
var items=[];

function $(s){return document.querySelector(s)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function money(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function load(){
  try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");items=Array.isArray(a)?a:[]}catch(e){items=[]}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
}

function render(){
  var month=$("#month").value;
  var shown=items.filter(function(x){return !month||x.date.slice(0,7)===month});
  shown.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});

  var total=0,sums={};
  shown.forEach(function(x){total+=x.amount;sums[x.cat]=(sums[x.cat]||0)+x.amount});
  $("#total").textContent=money(total);
  $("#count").textContent=shown.length+" kharche";

  var bars=$("#bars");bars.textContent="";
  var max=0;CATS.forEach(function(c){if((sums[c]||0)>max)max=sums[c]});
  if(!max){bars.appendChild(el("div","empty","Abhi koi kharcha nahi."))}
  CATS.forEach(function(c){
    if(!sums[c])return;
    var row=el("div","bar-row"),top=el("div","bar-top");
    top.appendChild(el("span",null,c));top.appendChild(el("b",null,money(sums[c])));
    var bar=el("div","bar"),fill=document.createElement("i");
    fill.style.width=Math.round(sums[c]/max*100)+"%";
    bar.appendChild(fill);row.appendChild(top);row.appendChild(bar);bars.appendChild(row);
  });

  var list=$("#list");list.textContent="";
  if(!shown.length)list.appendChild(el("li","empty","Is mahine ka koi kharcha nahi mila."));
  shown.forEach(function(x){
    var li=el("li","item"),info=el("div","info");
    info.appendChild(el("div","note",x.note||x.cat));
    info.appendChild(el("div","sub",x.cat+" • "+x.date));
    var del=el("button","del","Hatao");del.type="button";
    del.onclick=function(){items=items.filter(function(i){return i.id!==x.id});save();render()};
    li.appendChild(info);li.appendChild(el("div","amt",money(x.amount)));li.appendChild(del);
    list.appendChild(li);
  });
}

CATS.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;$("#cat").appendChild(o)});
$("#date").value=today();
$("#month").value=today().slice(0,7);

$("#form").addEventListener("submit",function(e){
  e.preventDefault();
  var amt=parseFloat($("#amount").value);
  if(!(amt>0))return;
  items.push({id:Date.now(),amount:amt,cat:$("#cat").value,note:$("#note").value.trim(),date:$("#date").value});
  save();
  $("#amount").value="";$("#note").value="";$("#amount").focus();
  $("#month").value=$("#date").value.slice(0,7);
  render();
});
$("#month").addEventListener("change",render);
$("#clear").onclick=function(){
  if(items.length&&confirm("Saare kharche hata dene hain?")){items=[];save();render()}
};

load();render();
})();
</script>
</body>
</html>
